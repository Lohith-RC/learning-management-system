spring:
  application:
    name: skillforge-backend

  datasource:
    url: ${DB_URL}          # e.g. jdbc:postgresql://<supabase-host>:5432/postgres
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate      # Preetham owns migrations; app should never auto-generate schema
    show-sql: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

jwt:
  secret: ${JWT_SECRET}        # HS256 signing secret - never commit a real value
  access-token-expiry-minutes: 15
  refresh-token-expiry-days: 7

refresh-token-expiry-seconds: ${REFRESH_TOKEN_EXPIRY_SECONDS:604800}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
